services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
